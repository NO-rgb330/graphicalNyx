<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NyxOS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack.css">
<style>
:root{
  --bg:#000;--fg:#d4d4d4;--dim:#7c7c7c;--bright:#fff;
  --panel:#0a0a0a;--panel2:#121212;--border:#262626;--title:#0f0f0f;
  --hover:rgba(255,255,255,.07);--sel:rgba(255,255,255,.14);
  --win-bg:#050505;--input:#000;
  --taskbar:rgba(5,5,5,.85);--shadow:0 20px 50px rgba(0,0,0,.8);
}
body.light{
  --bg:#f0f0f0;--fg:#1a1a1a;--dim:#666;--bright:#000;
  --panel:#fafafa;--border:#d8d8d8;--title:#e8e8e8;
  --hover:rgba(0,0,0,.06);--sel:rgba(0,0,0,.12);
  --win-bg:#fff;--input:#fff;
  --taskbar:rgba(250,250,250,.88);--shadow:0 20px 50px rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Hack','Hack Nerd Font','DejaVu Sans Mono','Courier New',monospace;
  font-size:13px;line-height:1.5;background:var(--bg);color:var(--fg);
  user-select:none;-webkit-font-smoothing:antialiased;
}
input,textarea,select,.nx-terminal,.selectable{user-select:text}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#444;background-clip:content-box}
body.light ::-webkit-scrollbar-thumb{background:#bbb;background-clip:content-box}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;background:#000;color:#d4d4d4;z-index:9999;
  padding:16px 20px;overflow-y:auto;font-size:13px;line-height:1.5;
  transition:opacity .5s ease;font-family:'Hack',monospace}
#boot.done{opacity:0;pointer-events:none}
#bootout{white-space:pre-wrap;word-break:break-word}
#bootout .ok{color:#fff;font-weight:700}
#bootout .dim{color:#7c7c7c}
#bootout .bright{color:#fff;font-weight:700}
#bootout .fail{color:#fff;font-weight:700;text-decoration:underline}
#bootout .warn{color:#fff;font-weight:700}

.boot-btn{
  display:inline-block;padding:8px 16px;margin:6px 6px 6px 0;
  background:#fff;color:#000;border:0;border-radius:3px;
  font-family:'Hack',monospace;font-size:12px;font-weight:700;
  letter-spacing:.04em;cursor:pointer;transition:background .12s;
}
.boot-btn:hover{background:#d4d4d4}
.boot-btn:disabled{background:#333;color:#666;cursor:default}
.boot-btn.secondary{background:transparent;color:#d4d4d4;border:1px solid #262626}
.boot-btn.secondary:hover{background:#111}
.boot-panel{
  margin:14px 0;padding:14px 16px;background:#050505;
  border:1px solid #262626;border-radius:4px;max-width:640px;
}
.boot-panel .t{color:#fff;font-weight:700;margin-bottom:8px;font-size:13px}
.boot-panel .d{color:#7c7c7c;font-size:11.5px;line-height:1.7;margin-bottom:10px}

/* ---------- lock ---------- */
#lock{
  position:fixed;inset:0;z-index:9000;display:none;
  background:#000;color:#d4d4d4;
  font-family:'Hack','Hack Nerd Font','DejaVu Sans Mono','Courier New',monospace;
  font-size:14px;line-height:1.65;
  padding:44px 52px;overflow:auto;
}
#lock.show{display:block}
.lock-wrap{max-width:820px;margin:0 auto}
#lock-out .lock-line{white-space:pre-wrap;word-break:break-word}
.lock-line{white-space:pre-wrap;word-break:break-word}
.lock-hdr{color:#fff;font-weight:700;font-size:16px;letter-spacing:.06em}
.lock-blank{min-height:1.65em}
#lock-prompt{color:#fff;font-weight:700}
#lock-typed{color:#d4d4d4}
.lock-cursor{
  color:#d4d4d4;display:inline-block;
  animation:lockBlink 1.1s steps(1,end) infinite;
}
@keyframes lockBlink{0%,49.99%{opacity:1}50%,100%{opacity:0}}
.lock-err{color:#fff;font-weight:700;text-decoration:underline}
.lock-dim{color:#7c7c7c}
#lock-input{
  position:fixed;top:0;left:0;
  width:1px;height:1px;border:0;outline:none;
  background:transparent;color:transparent;
  caret-color:transparent;
  opacity:0;
  z-index:9001;
}

/* ---------- desktop ---------- */
#desktop{position:fixed;inset:0;display:none}
#desktop.show{display:block}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;
  transition:background .3s ease}
#icons{position:absolute;top:14px;left:14px;right:14px;bottom:60px;
  display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;
  gap:4px;pointer-events:none}
.dicon{pointer-events:auto;width:96px;padding:10px 4px 8px;border-radius:4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:default;text-align:center;transition:background .1s;border:1px solid transparent}
.dicon:hover{background:rgba(255,255,255,.07)}
.dicon.sel{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
.dicon.unavailable{opacity:.35;cursor:not-allowed}
.dicon .ico{font-size:26px;line-height:1;color:#fff}
.dicon .lbl{font-size:11px;color:#fff;line-height:1.3;
  text-shadow:0 1px 3px rgba(0,0,0,.9);word-break:break-word;max-width:88px}
body.light .dicon .ico{color:#000}
body.light .dicon .lbl{color:#000;text-shadow:0 1px 3px rgba(255,255,255,.9)}
body.light .dicon:hover{background:rgba(0,0,0,.06)}
body.light .dicon.sel{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.28)}

/* ---------- windows ---------- */
#windows{position:absolute;inset:0 0 46px 0;pointer-events:none}
.window{position:absolute;pointer-events:auto;background:var(--win-bg);
  border:1px solid var(--border);border-radius:4px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;min-width:280px;min-height:180px;
  animation:winOpen .14s ease-out}
@keyframes winOpen{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.window.minimized{display:none}
.window.maximized{border-radius:0}
.window.focused{border-color:#555}
body.light .window.focused{border-color:#888}
.titlebar{height:32px;flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:0 4px 0 10px;background:var(--title);border-bottom:1px solid var(--border);cursor:grab}
.titlebar:active{cursor:grabbing}
.tb-icon{font-size:13px;color:var(--bright)}
.tb-title{font-size:12px;color:var(--fg);flex:1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.tb-btns{display:flex;gap:1px}
.tb-btns button{width:26px;height:24px;border-radius:3px;font-size:12px;
  color:var(--dim);display:grid;place-items:center;transition:background .1s,color .1s}
.tb-btns button:hover{background:var(--hover);color:var(--fg)}
.tb-close:hover{background:#fff!important;color:#000!important}
body.light .tb-close:hover{background:#000!important;color:#fff!important}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.rz{position:absolute;z-index:6}
.rz-n{top:0;left:8px;right:8px;height:4px;cursor:ns-resize}
.rz-s{bottom:0;left:8px;right:8px;height:4px;cursor:ns-resize}
.rz-e{right:0;top:8px;bottom:8px;width:4px;cursor:ew-resize}
.rz-w{left:0;top:8px;bottom:8px;width:4px;cursor:ew-resize}
.rz-ne{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
.rz-nw{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.rz-se{bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize}
.rz-sw{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}

/* ---------- taskbar ---------- */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:46px;z-index:500;
  display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--taskbar);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border)}
#startbtn{width:36px;height:36px;border-radius:4px;font-size:16px;color:var(--bright);
  display:grid;place-items:center;transition:background .12s}
#startbtn:hover{background:var(--hover)}
#startbtn.on{background:var(--bright);color:var(--bg)}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden}
.task{display:flex;align-items:center;gap:7px;max-width:190px;padding:6px 11px;
  border-radius:3px;font-size:11.5px;border:1px solid transparent;color:var(--dim);
  transition:background .1s,color .1s;position:relative}
.task:hover{background:var(--hover);color:var(--fg)}
.task.active::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;
  height:2px;background:var(--bright);opacity:.8}
.task.focus{background:var(--hover);color:var(--fg);border-color:var(--border)}
.task .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .ti{font-size:12px;color:var(--bright)}
#tray{display:flex;align-items:center;gap:12px;padding:0 8px;font-size:11px;color:var(--dim)}
#clock{text-align:right;line-height:1.3;font-size:11px}
#clock b{display:block;font-size:12px;font-weight:700;color:var(--fg)}

/* ---------- start menu ---------- */
#startmenu{position:absolute;left:8px;bottom:54px;width:340px;z-index:600;
  background:var(--panel);border:1px solid var(--border);border-radius:4px;
  box-shadow:var(--shadow);padding:12px;display:none;flex-direction:column;gap:10px}
#startmenu.show{display:flex;animation:menuIn .14s ease-out}
@keyframes menuIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sm-search{width:100%;padding:8px 10px;border-radius:3px;font-size:12px;
  outline:none;background:var(--input);border:1px solid var(--border);color:var(--fg);
  font-family:inherit}
.sm-search:focus{border-color:#555}
.sm-label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;
  color:var(--dim);padding-left:4px}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px 4px;border-radius:3px;font-size:10.5px;transition:background .1s;color:var(--dim)}
.sm-app:hover{background:var(--hover);color:var(--fg)}
.sm-app.unavailable{opacity:.35;cursor:not-allowed}
.sm-app .ico{font-size:20px;color:var(--bright)}
.sm-foot{display:flex;gap:6px;border-top:1px solid var(--border);padding-top:10px;flex-wrap:wrap}
.sm-foot button{flex:1;min-width:calc(50% - 3px);padding:8px;border-radius:3px;font-size:11px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:6px;transition:background .1s,color .1s}
.sm-foot button:hover{background:var(--hover);color:var(--fg)}

/* ---------- python-rendered widgets ---------- */
.nx-label{padding:4px 8px;color:var(--fg);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.nx-label.nx-lg{font-size:16px;font-weight:700;color:var(--bright)}
.nx-label.nx-huge{font-size:26px;font-weight:400;color:var(--bright);
  font-family:'Hack',monospace;letter-spacing:.02em}
.nx-label.nx-dim{color:var(--dim);font-size:11.5px}
.nx-label.nx-center{text-align:center}
.nx-label.nx-right{text-align:right}
.nx-label.nx-bold{font-weight:700;color:var(--bright)}
.nx-button{padding:8px 12px;border:1px solid var(--border);border-radius:3px;
  background:var(--panel);color:var(--fg);cursor:pointer;font-size:12px;
  text-align:center;transition:background .08s,transform .05s;user-select:none}
.nx-button:hover{background:var(--hover)}
.nx-button:active{transform:scale(.97)}
.nx-button.nx-primary{background:var(--bright);color:var(--bg);border-color:transparent;font-weight:700}
.nx-button.nx-flat{border:0;background:transparent;padding:4px 8px;color:var(--dim)}
.nx-button.nx-calc{padding:12px 8px;font-size:14px}
.nx-button.nx-eq{background:var(--bright);color:var(--bg);font-weight:700;border-color:transparent}
.nx-input{padding:8px 10px;border-radius:3px;border:1px solid var(--border);
  background:var(--input);color:var(--fg);font-family:inherit;font-size:12.5px;
  outline:none;width:100%}
.nx-input:focus{border-color:#555}
.nx-select{padding:6px 10px;border-radius:3px;
  background:var(--input);color:var(--fg);border:1px solid var(--border);
  font-family:inherit;font-size:12.5px;outline:none;cursor:pointer;min-width:80px}
.nx-select:focus{border-color:#555}
.nx-select option{background:var(--input);color:var(--fg)}
.nx-textarea{flex:1;min-height:120px;resize:none;outline:none;
  background:var(--input);color:var(--fg);border:1px solid var(--border);
  border-radius:3px;padding:10px 12px;font-family:inherit;font-size:12.5px;
  line-height:1.6;white-space:pre;tab-size:4;width:100%}
.nx-row{display:flex;gap:6px;padding:2px 4px}
.nx-row>*{flex:1}
.nx-grid{display:grid;gap:6px;padding:4px}
.nx-spacer{width:100%}
.nx-terminal{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;
  background:var(--win-bg);color:var(--fg);font-family:'Hack',monospace;
  font-size:12.5px;line-height:1.5;cursor:text;display:flex;flex-direction:column}
.nx-term-out{flex:1;white-space:pre-wrap;word-break:break-word}
.nx-term-line-out{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.nx-term-line-out.err{color:#fff;font-weight:700;text-decoration:underline}
.nx-term-line-out.dim{color:#7c7c7c}
.nx-term-line-out.bright{color:#fff;font-weight:700}
body.light .nx-term-line-out.err{color:#000;text-decoration:underline}
body.light .nx-term-line-out.bright{color:#000;font-weight:700}
.nx-term-line{display:flex;gap:0;align-items:baseline;margin-top:2px}
.nx-term-ps{color:#fff;font-weight:700;flex:0 0 auto;white-space:pre}
body.light .nx-term-ps{color:#000}
.nx-term-in{flex:1;background:none;border:0;outline:none;color:var(--fg);
  font:inherit;padding:0;caret-color:#fff}
body.light .nx-term-in{caret-color:#000}
.nx-card{background:var(--panel);border:1px solid var(--border);border-radius:3px;
  padding:12px 14px;font-size:12px;color:var(--dim);line-height:1.8}
.nx-bar-row{display:flex;align-items:center;gap:10px;font-size:11.5px;padding:3px 0}
.nx-bar-lbl{width:90px;color:var(--dim);flex:0 0 auto}
.nx-bar-track{flex:1;height:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:2px;overflow:hidden}
.nx-bar-fill{height:100%;background:var(--bright);transition:width .5s ease}
.nx-bar-val{width:52px;text-align:right;color:var(--bright);font-weight:700;flex:0 0 auto}
.nx-wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;padding:4px}
.nx-wall{height:58px;border-radius:3px;cursor:pointer;border:2px solid transparent;
  transition:transform .12s,border-color .12s}
.nx-wall:hover{transform:translateY(-2px)}
.nx-wall.on{border-color:var(--bright)}
.nx-switch{width:42px;height:22px;border-radius:12px;background:var(--border);
  position:relative;transition:background .18s;flex:0 0 auto;cursor:pointer}
.nx-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
body.light .nx-switch::after{background:#000}
.nx-switch.on{background:var(--bright)}
.nx-switch.on::after{transform:translateX(20px);background:var(--bg)}
body.light .nx-switch.on::after{background:#fff}

/* ---------- toast ---------- */
#toast{position:absolute;bottom:62px;left:50%;transform:translate(-50%,14px);
  background:var(--panel);border:1px solid var(--border);color:var(--fg);
  padding:10px 18px;border-radius:4px;font-size:11.5px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:all .22s;z-index:800;letter-spacing:.03em}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="boot"><div id="bootout"></div></div>

<div id="lock">
  <div class="lock-wrap">
    <div id="lock-out"></div>
    <div class="lock-line">
      <span id="lock-prompt"></span><span id="lock-typed"></span><span class="lock-cursor">&#9608;</span>
    </div>
  </div>
  <input id="lock-input" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
</div>

<div id="desktop">
  <div id="wall"></div>
  <div id="icons"></div>
  <div id="windows"></div>

  <div id="startmenu">
    <input class="sm-search" id="smsearch" placeholder="search apps...">
    <div class="sm-label">Applications</div>
    <div class="sm-grid" id="smgrid"></div>
    <div class="sm-foot">
      <button id="smtheme"><span>&#9680;</span> Theme</button>
      <button id="smreload">&#8635; Reload Sources</button>
      <button id="smlock">&#9632; Lock</button>
      <button id="smreboot">&#8635; Reboot</button>
    </div>
  </div>

  <div id="taskbar">
    <button id="startbtn" title="Start">&#9672;</button>
    <div id="tasks"></div>
    <div id="tray">
      <span id="trayInfo">&#9675;</span>
      <div id="clock"><b>--:--</b><span>--</span></div>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script>
"use strict";
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ==================================================================
   IndexedDB
   ================================================================== */
const IDB_NAME = 'nyxos.v1';
const IDB_STORE = 'kv';
const IDB_VERSION = 1;

function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key){
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const r = tx.objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  } catch(e){ return null; }
}
async function idbSet(key, val){
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch(e){ return; }
}
async function idbDelete(key){
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch(e){ return; }
}

/* ==================================================================
   Source loader
   ================================================================== */
const NYX_FILES = [
  'nyx-prelude.nyx',
  'apps/terminal.nyx',
  'apps/files.nyx',
  'apps/editor.nyx',
  'apps/calculator.nyx',
  'apps/calendar.nyx',
  'apps/settings.nyx',
  'apps/about.nyx'
];
const IDB_SOURCES_KEY = 'sources.v1';
const IDB_HANDLE_KEY  = 'handle.v1';

const SourceLoader = {
  sources: {},
  method: null,
  handle: null,

  async tryHttp(){
    if(location.protocol !== 'http:' && location.protocol !== 'https:') return null;
    try {
      const out = {};
      for(const f of NYX_FILES){
        const res = await fetch(f, { cache:'no-store' });
        if(!res.ok) return null;
        out[f] = await res.text();
      }
      return out;
    } catch(e){ return null; }
  },

  async readFromHandle(handle){
    const out = {};
    try {
      const preludeFH = await handle.getFileHandle('nyx-prelude.nyx');
      out['nyx-prelude.nyx'] = await (await preludeFH.getFile()).text();
    } catch(e){}
    let appsDir = null;
    try { appsDir = await handle.getDirectoryHandle('apps'); } catch(e){}
    if(appsDir){
      for(const spec of NYX_FILES){
        if(!spec.startsWith('apps/')) continue;
        const name = spec.slice(5);
        try {
          const fh = await appsDir.getFileHandle(name);
          out[spec] = await (await fh.getFile()).text();
        } catch(e){}
      }
    }
    return out;
  },

  async tryRestoreHandle(){
    if(!window.showDirectoryPicker) return null;
    try {
      const handle = await idbGet(IDB_HANDLE_KEY);
      if(!handle || !handle.queryPermission) return null;
      const perm = await handle.queryPermission({ mode:'read' });
      if(perm !== 'granted') return null;
      const out = await this.readFromHandle(handle);
      this.handle = handle;
      return out;
    } catch(e){ return null; }
  },

  async pickWithFSA(){
    if(!window.showDirectoryPicker) throw new Error('File System Access API not available');
    const handle = await window.showDirectoryPicker({ mode:'read', id:'nyxos' });
    const out = await this.readFromHandle(handle);
    this.handle = handle;
    try { await idbSet(IDB_HANDLE_KEY, handle); } catch(e){}
    return out;
  },

  pickWithWebkitDirectory(){
    return new Promise(resolve => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.webkitdirectory = true;
      inp.multiple = true;
      inp.style.display = 'none';
      inp.onchange = async () => {
        try {
          const files = Array.from(inp.files);
          const out = {};
          const wanted = new Set(NYX_FILES);
          for(const f of files){
            const rel = f.webkitRelativePath.replace(/^[^/]+\//, '');
            if(wanted.has(rel)) out[rel] = await f.text();
          }
          inp.remove();
          resolve(Object.keys(out).length ? out : null);
        } catch(e){
          inp.remove();
          resolve(null);
        }
      };
      inp.oncancel = () => { inp.remove(); resolve(null); };
      document.body.appendChild(inp);
      inp.click();
    });
  },

  async tryCache(){
    try {
      const cached = await idbGet(IDB_SOURCES_KEY);
      if(!cached || typeof cached !== 'object') return null;
      if(!cached['nyx-prelude.nyx']) return null;
      return cached;
    } catch(e){ return null; }
  },

  async saveToCache(){
    try { await idbSet(IDB_SOURCES_KEY, this.sources); } catch(e){}
  },

  async clearCache(){
    await idbDelete(IDB_SOURCES_KEY);
    await idbDelete(IDB_HANDLE_KEY);
  }
};

/* ==================================================================
   Filesystem
   ================================================================== */
function mkfile(content='', owner='root'){ return { type:'file', content, owner, mtime:Date.now() }; }
function mkdir(owner='root'){ return { type:'dir', children:{}, owner, mtime:Date.now() }; }

const SYS_FILES = ['nyx-core.nyx','nyx-lang.nyx','nyx-shell.nyx','hack-font.ttf',
                   'nyx-docs.txt','nyx-fs.nyx','nyx-users.nyx','nyx-init.nyx'];

function makeFS(){
  const root = mkdir();
  root.children = {
    system: mkdir(), home: mkdir(), etc: mkdir(), tmp: mkdir(), bin: mkdir()
  };
  SYS_FILES.forEach(f => {
    root.children.system.children[f] = mkfile('# ' + f + ' - nyx runtime component\n');
  });
  root.children.etc.children = {
    motd: mkfile('', 'root'),
    hostname: mkfile('nyx\n', 'root'),
    passwd: mkfile('', 'root'),
    shadow: mkfile('', 'root')
  };
  root.children.bin.children = {
    'nyx': mkfile('# nyx interpreter\n', 'root'),
    'sh':  mkfile('# shell\n', 'root')
  };
  return root;
}
let FS = makeFS();

function getNode(path){
  const parts = String(path).split('/').filter(Boolean);
  let node = FS;
  for(const p of parts){
    if(node.type !== 'dir' || !node.children[p]) return null;
    node = node.children[p];
  }
  return node;
}
function getParent(path){
  const parts = String(path).split('/').filter(Boolean);
  if(!parts.length) return { parent:null, name:null };
  const name = parts.pop();
  const parent = getNode('/' + parts.join('/'));
  return { parent, name };
}
function isSystemPath(path){
  const parts = String(path).split('/').filter(Boolean);
  return parts.length > 0 && parts[0] === 'system';
}

/* ==================================================================
   Users
   ================================================================== */
function readUsers(){
  const n = getNode('/etc/passwd');
  if(!n || !n.content) return [];
  return n.content.split('\n').filter(Boolean).map(line => {
    const p = line.split(':');
    return {
      username: p[0],
      uid: parseInt(p[2], 10) || 0,
      gid: parseInt(p[3], 10) || 0,
      home: p[5] || '/home/' + p[0],
      shell: p[6] || '/bin/nyx'
    };
  });
}
function readShadow(){
  const n = getNode('/etc/shadow');
  if(!n || !n.content) return {};
  const out = {};
  n.content.split('\n').filter(Boolean).forEach(l => {
    const i = l.indexOf(':');
    if(i > -1) out[l.slice(0, i)] = l.slice(i + 1);
  });
  return out;
}
function userExists(name){ return readUsers().some(u => u.username === name); }

function createUser(username, password){
  if(userExists(username)) return false;
  const passwd = getNode('/etc/passwd'), shadow = getNode('/etc/shadow');
  if(!passwd || !shadow) return false;
  let uid, gid, home;
  if(username === 'root'){ uid = 0; gid = 0; home = '/root'; }
  else {
    const users = readUsers();
    const maxUid = users.reduce((m,u) => Math.max(m, u.uid === 0 ? 999 : u.uid), 999);
    uid = Math.max(1000, maxUid + 1); gid = uid; home = '/home/' + username;
  }
  passwd.content = (passwd.content ? passwd.content.replace(/\n?$/,'\n') : '')
    + `${username}:x:${uid}:${gid}:${username}:${home}:/bin/nyx`;
  shadow.content = (shadow.content ? shadow.content.replace(/\n?$/,'\n') : '')
    + `${username}:${password}`;
  if(username === 'root' && !FS.children.root) FS.children.root = mkdir('root');
  const hp = home.split('/').filter(Boolean);
  const parent = getNode('/' + hp.slice(0, -1).join('/'));
  const homeName = hp[hp.length - 1];
  if(parent && parent.type === 'dir' && !parent.children[homeName]){
    parent.children[homeName] = mkdir(username);
    parent.children[homeName].children['.profile'] = mkfile('# ' + username + ' profile\n', username);
    const doc = mkdir(username);
    doc.children['welcome.txt'] = mkfile(
`Welcome to NyxOS, ${username}.

Every application here is a Python file with a .nyx extension.
Open the terminal and type "help" to explore, or read this file
in the Editor.

- nyx
`, username);
    doc.children['notes.txt'] = mkfile(
`todo:
  [x] install nyxos
  [ ] explore the filesystem
  [ ] write something in the editor
  [ ] read /etc/motd
`, username);
    doc.children['hello.nyx'] = mkfile(
`# example .nyx application
# run it from the terminal with:  run hello.nyx

def main(app):
    app.title("Hello")
    app.size(400, 220)
    app.spacer(10)
    app.label("hello from a user-made .nyx file!", align="center", size="lg")
    app.spacer(6)
    app.label("this window was launched by the terminal.", align="center", cls="nx-dim")
    app.spacer(10)

    def close_it():
        app.close()

    row = app.row()
    row.set_style("justify-content", "center")
    row.button("close", close_it, cls="nx-primary")


nyx.run(main)
`, username);
    parent.children[homeName].children['documents'] = doc;
  }
  return true;
}

const LS_FS = 'nyxos.fs.v1';
const LS_SET = 'nyxos.settings.v1';

let suppressSaveOnUnload = false;

const Storage = {
  available: false,
  init(){
    try { localStorage.setItem('__nyx_probe__','1'); localStorage.removeItem('__nyx_probe__'); this.available = true; }
    catch(e){ this.available = false; }
  },
  loadFS(){
    if(!this.available) return null;
    try {
      const raw = localStorage.getItem(LS_FS);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data || !data.tree || data.tree.type !== 'dir') return null;
      return data.tree;
    } catch(e){ return null; }
  },
  saveFS(){
    if(!this.available) return;
    try { localStorage.setItem(LS_FS, JSON.stringify({ savedAt:Date.now(), tree:FS })); } catch(e){}
  },
  loadSettings(){
    try {
      const raw = localStorage.getItem(LS_SET);
      if(!raw) return;
      const s = JSON.parse(raw);
      if(s && typeof s === 'object'){
        if(typeof s.wallpaper === 'number') settings.wallpaper = s.wallpaper;
        if(typeof s.theme === 'string') settings.theme = s.theme;
        if(typeof s.font_scale === 'number') settings.font_scale = s.font_scale;
      }
    } catch(e){}
  },
  saveSettings(){
    if(!this.available) return;
    try { localStorage.setItem(LS_SET, JSON.stringify(settings)); } catch(e){}
  },
  wipe(){
    try { localStorage.removeItem(LS_FS); localStorage.removeItem(LS_SET); } catch(e){}
  }
};
window.addEventListener('beforeunload', () => {
  if(suppressSaveOnUnload) return;
  Storage.saveFS();
});

let pyodide = null;

async function initPyodide(){
  if(!window.loadPyodide){
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js';
      s.onload = res;
      s.onerror = () => rej(new Error('failed to load pyodide.js'));

  await pyodide.runPythonAsync(PRELUDE_SOURCE);
  pyNyxExec = pyodide.globals.get('_nyx_exec');
}

async function runNyxApp(appId, source, opts){
  const wid = __nyxjs.currentWindow();
  __nyxjs._currentOpts = opts || {};
  try {
    await pyNyxExec(source, appId);
  } catch(e){
    __nyxjs.appPrint(wid, 'runtime error: ' + (e && e.message ? e.message : String(e)), 'err');
    console.error(e);
  } finally {
    __nyxjs._currentOpts = {};
  }
}

/* ==================================================================
   JS <-> Python bridge
   ================================================================== */
function propGet(p, key){
  if(p === undefined || p === null) return undefined;
  if(typeof p.get === 'function') return p.get(key);
  return p[key];
}

function toJsArray(v){
  if(v === undefined || v === null) return [];
  if(Array.isArray(v)) return v.map(x => String(x));
  if(typeof v.toJs === 'function'){
    const arr = v.toJs();
    return Array.isArray(arr) ? arr.map(x => String(x)) : [];
  }
  if(typeof v.length === 'number'){
    const out = [];
    for(let i = 0; i < v.length; i++) out.push(String(v[i]));
    return out;
  }
  return [];
}

const __nyxjs = {
  _seq: 0,
  _els: new Map(),
  _currentWid: null,
  _currentOpts: {},

  currentWindow(){ return this._currentWid; },
  setCurrent(wid){ this._currentWid = wid; },
  getCurrentOpts(){ return JSON.stringify(this._currentOpts || {}); },

  _getEl(id){
    if(this._els.has(id)) return this._els.get(id);
    const w = openWindows.get(id);
    return w ? w.body : null;
  },

  addElement(parentId, tag, props){
    const parent = this._getEl(parentId);
    if(!parent) throw new Error('parent not found: ' + parentId);
    const eid = 'e' + (++this._seq);
    let el;
    const cls = (propGet(props, 'cls') || '').split(' ').filter(Boolean);

    if(tag === 'input'){
      el = document.createElement('input');
      el.className = 'nx-input';
      el.placeholder = propGet(props, 'placeholder') || '';
      el.value = propGet(props, 'value') || '';
    } else if(tag === 'textarea'){
      el = document.createElement('textarea');
      el.className = 'nx-textarea';
      el.value = propGet(props, 'value') || '';
      el.spellcheck = false;
      el.wrap = 'off';
    } else if(tag === 'select'){
      el = document.createElement('select');
      el.className = 'nx-select';
      const opts = toJsArray(propGet(props, 'options'));
      for(const o of opts){
        const opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o;
        el.appendChild(opt);
      }
      const want = propGet(props, 'value');
      if(want !== undefined && want !== null && want !== ''){
        el.value = String(want);
      }
    } else {
      el = document.createElement('div');
      el.className = 'nx-' + tag;
      if(tag === 'label'){
        el.textContent = propGet(props, 'text') || '';
        const align = propGet(props, 'align');
        const size = propGet(props, 'size');
        if(align) el.style.textAlign = align;
        if(size === 'large' || size === 'lg') el.classList.add('nx-lg');
        if(size === 'huge') el.classList.add('nx-huge');
        if(align === 'center') el.classList.add('nx-center');
        if(align === 'right') el.classList.add('nx-right');
      } else if(tag === 'button'){
        el.textContent = propGet(props, 'text') || '';
        el.setAttribute('tabindex', '0');
        el.addEventListener('keydown', e => {
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); }
        });
      } else if(tag === 'grid'){
        el.style.display = 'grid';
        el.style.gridTemplateColumns = `repeat(${propGet(props, 'cols') || 4}, 1fr)`;
      } else if(tag === 'spacer'){
        el.style.height = (propGet(props, 'h') || 8) + 'px';
        el.classList.add('nx-spacer');
      } else if(tag === 'terminal'){
        el.innerHTML =
          '<div class="nx-term-out"></div>' +
          '<div class="nx-term-line">' +
            '<span class="nx-term-ps"></span>' +
            '<input class="nx-term-in" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off">' +
          '</div>';
        const inp = el.querySelector('.nx-term-in');
        const ps = el.querySelector('.nx-term-ps');
        const out = el.querySelector('.nx-term-out');
        ps.textContent = (propGet(props, 'prompt') || '>') + ' ';
        el._onCommand = null;
        inp.addEventListener('keydown', e => {
          if(e.key === 'Enter'){
            const cmd = inp.value;
            inp.value = '';
            this._termAppend(el, ps.textContent + cmd);
            if(el._onCommand){
              try { el._onCommand(cmd); } catch(err){ this._termAppend(el, String(err), 'err'); }
            }
            out.scrollTop = out.scrollHeight;
          }
        });
        el.addEventListener('click', e => { if(e.target !== inp) inp.focus(); });
        setTimeout(() => inp.focus(), 60);
      } else if(tag === 'card'){
        el.textContent = propGet(props, 'text') || '';
        el.classList.add('nx-card');
      } else if(tag === 'bar'){
        el.className = 'nx-bar-row';
        el.innerHTML =
          `<span class="nx-bar-lbl">${esc(propGet(props, 'label') || '')}</span>` +
          `<div class="nx-bar-track"><div class="nx-bar-fill" style="width:0%"></div></div>` +
          `<span class="nx-bar-val">0%</span>`;
      } else if(tag === 'wall'){
        el.className = 'nx-wall';
        el.style.background = propGet(props, 'css') || '#111';
        if(propGet(props, 'on')) el.classList.add('on');
      } else if(tag === 'switch'){
        el.className = 'nx-switch' + (propGet(props, 'on') ? ' on' : '');
      }
      if(cls.length) cls.forEach(c => el.classList.add(c));
    }
    el.dataset.eid = eid;
    this._els.set(eid, el);
    parent.appendChild(el);
    return eid;
  },

  _termAppend(termEl, text, cls){
    const out = termEl.querySelector('.nx-term-out');
    const line = document.createElement('div');
    line.className = 'nx-term-line-out' + (cls ? ' ' + cls : '');
    line.textContent = text;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  },

  getProp(eid, prop){
    const el = this._els.get(eid);
    if(!el) return '';
    if(prop === 'text') return el.textContent;
    if(prop === 'value') return el.value;
    return '';
  },
  setProp(eid, prop, value){
    const el = this._els.get(eid);
    if(!el) return;
    if(prop === 'text') el.textContent = value;
    else if(prop === 'value') el.value = value;
    else if(prop === 'html') el.innerHTML = value;
  },
  setStyle(eid, prop, value){
    const el = this._els.get(eid);
    if(el) el.style[prop] = value;
  },
  addClass(eid, cls){
    const el = this._els.get(eid);
    if(el) cls.split(' ').forEach(c => c && el.classList.add(c));
  },
  onClick(eid, fn){
    const el = this._els.get(eid);
    if(!el) return;
    el.addEventListener('click', () => { try { fn(); } catch(e){ console.error(e); } });
  },
  onInput(eid, fn){
    const el = this._els.get(eid);
    if(!el) return;
    el.addEventListener('input', () => { try { fn(el.value); } catch(e){ console.error(e); } });
  },
  onEnter(eid, fn){
    const el = this._els.get(eid);
    if(!el) return;
    el.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ try { fn(el.value); } catch(err){ console.error(err); } }
    });
  },
  onChange(eid, fn){
    const el = this._els.get(eid);
    if(!el) return;
    el.addEventListener('change', () => { try { fn(el.value); } catch(e){ console.error(e); } });
  },
  focus(eid){
    const el = this._els.get(eid);
    if(el && el.focus) el.focus();
  },
  remove(eid){
    const el = this._els.get(eid);
    if(!el) return;
    el.remove();
    this._els.delete(eid);
  },
  clearChildren(eid){
    const el = this._els.get(eid);
    if(!el) return;
    while(el.firstChild) el.removeChild(el.firstChild);
  },

  termPrint(eid, text, cls){
    const el = this._els.get(eid);
    if(!el) return;
    String(text).split('\n').forEach(l => this._termAppend(el, l, cls));
  },
  termClear(eid){
    const el = this._els.get(eid);
    if(el) el.querySelector('.nx-term-out').innerHTML = '';
  },
  termSetPrompt(eid, p){
    const el = this._els.get(eid);
    if(el) el.querySelector('.nx-term-ps').textContent = p + ' ';
  },
  termOnCommand(eid, fn){
    const el = this._els.get(eid);
    if(el) el._onCommand = fn;
  },
  termFocus(eid){
    const el = this._els.get(eid);
    if(el) el.querySelector('.nx-term-in').focus();
  },

  barSet(eid, pct){
    const el = this._els.get(eid);

    const fill = el.querySelector('.nx-bar-fill');
    const val = el.querySelector('.nx-bar-val');
    if(fill) fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if(val) val.textContent = pct.toFixed(0) + '%';
  },

  wallSetOn(eid, on){
    const el = this._els.get(eid);
    if(el) el.classList.toggle('on', !!on);
  },
  wallOnClick(eid, fn){
    const el = this._els.get(eid);
    if(!el) return;
    el.addEventListener('click', () => { try { fn(); } catch(e){ console.error(e); } });
  },
  switchSet(eid, on){
    const el = this._els.get(eid);
    if(el) el.classList.toggle('on', !!on);
  },
  listWallpapers(){ return wallpapersFor(settings.theme).slice(); },
  setWallpaper(i){
    settings.wallpaper = i;
    applySettings();
    Storage.saveSettings();
  },

  setTitle(wid, t){
    const w = openWindows.get(wid);
    if(!w) return;

    w.el.querySelector('.tb-title').textContent = t;

  setSize(wid, ww, hh){

    if(!w) return;
    w.el.style.width = ww + 'px';
    w.el.style.height = hh + 'px';
  },
  closeWin(wid){ closeWin(wid); },
  appPrint(wid, text, cls){

    let out = w.body.querySelector('.nx-app-print');
    if(!out){
      out = document.createElement('div');

      out.appendChild(line);
    });
  },
  toast(msg){ toast(msg); },

  fsRead(path){
    const n = getNode(path);
    if(!n || n.type !== 'file') return null;
    return n.content;
  },
  fsWrite(path, content){
    if(isSystemPath(path)){
      console.log('[nyx.fsWrite] reject /system:', path);
      return false;
    }
    const { parent, name } = getParent(path);
    if(!parent){ console.log('[nyx.fsWrite] reject no parent:', path); return false; }
    if(parent.type !== 'dir'){ console.log('[nyx.fsWrite] reject parent not dir:', path); return false; }
    const ex = parent.children[name];
    if(ex && ex.type === 'dir'){ console.log('[nyx.fsWrite] reject exists as dir:', path); return false; }
    parent.children[name] = mkfile(String(content), currentUser || 'root');
    Storage.saveFS();
    console.log('[nyx.fsWrite] OK', path, String(content).length + ' chars');
    return true;
  },
  fsMkdir(path){
    if(isSystemPath(path)) return false;
    const { parent, name } = getParent(path);
    if(!parent || parent.type !== 'dir') return false;
    if(parent.children[name]) return false;
    parent.children[name] = mkdir(currentUser || 'root');
    Storage.saveFS();
    return true;
  },
  fsRemove(path){
    if(isSystemPath(path)) return false;
    const { parent, name } = getParent(path);
    if(!parent || !parent.children[name]) return false;
    delete parent.children[name];
    Storage.saveFS();
    return true;
  },
  fsList(path){
    const n = getNode(path);
    if(!n || n.type !== 'dir') return '[]';
    return JSON.stringify(Object.keys(n.children));
  },
  fsExists(path){ return !!getNode(path); },
  fsIsDir(path){ const n = getNode(path); return !!(n && n.type === 'dir'); },
  fsCwd(){ return currentUserObj ? currentUserObj.home : '/home'; },
  fsHome(){ return currentUserObj ? currentUserObj.home : '/home'; },
  fsUser(){ return currentUser || 'user'; },

  openApp(appId, arg){ if(APP_BY_ID[appId]) openApp(appId); },
  openAppWithPath(appId, path){ if(APP_BY_ID[appId]) openApp(appId, { path }); },
  listApps(){ return APP_REGISTRY.map(a => a.id + ' - ' + a.name + (APP_AVAILABLE[a.id] ? '' : ' [missing]')); },

  /**
   * Returns true if the given string is a registered app id
   * (built-in apps plus any user .nyx apps currently loaded).
   */
  hasApp(appId){
    return Object.prototype.hasOwnProperty.call(APP_BY_ID, appId);
  },

  /**
   * Launch a user-made .nyx file from the virtual filesystem as a
   * brand-new app window. The file's contents are registered under a
   * synthetic app id, then opened via the normal openApp pipeline.
   * Returns true on success, false on failure.
   */
  runNyxFile(path){
    const node = getNode(path);
    if(!node || node.type !== 'file'){
      console.log('[nyx.runNyxFile] cannot read', path);
      return false;
    }
    const name = path.split('/').pop();
    const appId = '__user_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    APP_BY_ID[appId] = {
      id: appId,
      name: name,
      icon: '\u25A0',
      width: 600,
      height: 440,
      _userFile: path
    };
    APP_AVAILABLE[appId] = true;
    SourceLoader.sources['apps/' + appId + '.nyx'] = node.content;
    console.log('[nyx.runNyxFile] launching', path, 'as', appId);
    openApp(appId);
    return true;
  },

  getSettings(){ return JSON.stringify(settings); },
  setSetting(key, value){
    settings[key] = value;
    applySettings();
    Storage.saveSettings();
  },

  resolution(){ return window.innerWidth + 'x' + window.innerHeight; },
  storageBackend(){ return Storage.available ? 'localStorage' : 'memory'; },
  cores(){ return navigator.hardwareConcurrency || 0; },
  uptimeSeconds(){ return Math.floor(performance.now() / 1000); },
  pythonVersion(){
    if(!pyodide) return 'loading...';
    try { return pyodide.runPython('import sys; sys.version.split()[0]'); }
    catch(e){ return 'unknown'; }
  },
  confirm(msg){ return window.confirm(msg); },
  wipeAll(){ Storage.wipe(); location.reload(); },

  resetBootAll(){
    suppressSaveOnUnload = true;
    try { localStorage.removeItem(LS_FS); } catch(e){}
    try { localStorage.removeItem(LS_SET); } catch(e){}
    try { sessionStorage.removeItem('nyx_welcomed'); } catch(e){}
    Storage.available = false;
    setTimeout(() => location.reload(), 400);
    return true;
  }
};
window.__nyxjs = __nyxjs;

/* ==================================================================
   Window Manager
   ================================================================== */
const openWindows = new Map();
let winZ = 10, winSeq = 0, focusedId = null;

function focusWin(id){
  const w = openWindows.get(id);
  if(!w) return;
  focusedId = id;
  w.el.style.zIndex = ++winZ;
  openWindows.forEach(x => x.el.classList.toggle('focused', x === w));
  renderTasks();
}
function minimizeWin(id){
  const w = openWindows.get(id);
  if(!w) return;
  w.minimized = true;
  w.el.classList.add('minimized');
  if(focusedId === id) focusedId = null;
  renderTasks();
}
function restoreWin(id){
  const w = openWindows.get(id);
  if(!w) return;
  w.minimized = false;
  w.el.classList.remove('minimized');
  renderTasks();
}
function closeWin(id){
  const w = openWindows.get(id);
  if(!w) return;
  w.el.style.transition = 'opacity .1s, transform .1s';
  w.el.style.opacity = '0';
  w.el.style.transform = 'scale(.97)';
  setTimeout(() => w.el.remove(), 100);
  openWindows.delete(id);
  if(focusedId === id) focusedId = null;
  renderTasks();
}
function toggleMax(id){
  const w = openWindows.get(id);
  if(!w) return;
  const el = w.el;
  const W = window.innerWidth, H = window.innerHeight - 46;
  if(w.maximized){
    w.maximized = false;
    el.classList.remove('maximized');
    const p = w.prev || { left:60, top:40, width:700, height:460 };
    el.style.left = p.left + 'px';
    el.style.top = p.top + 'px';
    el.style.width = p.width + 'px';
    el.style.height = p.height + 'px';
  } else {
    w.prev = { left:el.offsetLeft, top:el.offsetTop, width:el.offsetWidth, height:el.offsetHeight };
    w.maximized = true;
    el.classList.add('maximized');
    el.style.left = '0px';
    el.style.top = '0px';
    el.style.width = W + 'px';
    el.style.height = H + 'px';
  }
  focusWin(id);
}

function openApp(appId, opts = {}){
  const reg = APP_BY_ID[appId];
  if(!reg) return null;

  if(!APP_AVAILABLE[appId]){
    toast(appId + '.nyx is not installed');
    return null;
  }

  if(reg.single){
    for(const [id, w] of openWindows){
      if(w.appId === appId){ restoreWin(id); focusWin(id); return id; }
    }
  }

  const id = 'win' + (++winSeq);
  const el = document.createElement('div');
  el.className = 'window';
  const w = Math.min(opts.width || reg.width, window.innerWidth - 20);
  const h = Math.min(opts.height || reg.height, window.innerHeight - 80);
  const n = openWindows.size;
  const left = Math.max(8, Math.min(60 + n * 26, window.innerWidth - w - 16));
  const top  = Math.max(8, Math.min(40 + n * 24, window.innerHeight - h - 60));
  el.style.cssText = `left:${left}px;top:${top}px;width:${w}px;height:${h}px;`;

  el.innerHTML = `
    <div class="titlebar">
      <span class="tb-icon">${reg.icon}</span>
      <span class="tb-title">${esc(reg.name)}</span>
      <span class="tb-btns">
        <button class="tb-min" title="Minimize">-</button>
        <button class="tb-max" title="Maximize">[]</button>
        <button class="tb-close" title="Close">x</button>
      </span>
    </div>
    <div class="wbody"></div>
    ${['n','s','e','w','ne','nw','se','sw'].map(d => `<div class="rz rz-${d}" data-d="${d}"></div>`).join('')}
  `;
  document.getElementById('windows').appendChild(el);

  const body = el.querySelector('.wbody');
  const rec = { el, appId, body, title: reg.name, minimized:false, maximized:false, prev:null };
  openWindows.set(id, rec);

  el.querySelector('.tb-min').addEventListener('click', e => { e.stopPropagation(); minimizeWin(id); });
  el.querySelector('.tb-max').addEventListener('click', e => { e.stopPropagation(); toggleMax(id); });
  el.querySelector('.tb-close').addEventListener('click', e => { e.stopPropagation(); closeWin(id); });
  el.addEventListener('pointerdown', () => focusWin(id), true);

  const tb = el.querySelector('.titlebar');
  tb.addEventListener('pointerdown', e => startDrag(e, id));
  tb.addEventListener('dblclick', e => { if(!e.target.closest('.tb-btns')) toggleMax(id); });
  $$('.rz', el).forEach(h2 => h2.addEventListener('pointerdown', e => startResize(e, id, h2.dataset.d)));

  focusWin(id);

  (async () => {
    if(!pyodide){
      body.innerHTML = '<div style="padding:20px;color:#fff;font-size:12px">python runtime still booting...</div>';
      await waitForPyodide();
      body.innerHTML = '';
    }
    __nyxjs.setCurrent(id);
    const src = SourceLoader.sources['apps/' + appId + '.nyx'];
    if(!src){
      body.innerHTML = '<div style="padding:20px;color:#fff;font-size:12px">apps/' + appId + '.nyx not loaded</div>';
      return;
    }
    await runNyxApp(appId, src, opts);
  })();

  return id;
}

function waitForPyodide(){
  return new Promise(resolve => {
    const iv = setInterval(() => { if(pyodide){ clearInterval(iv); resolve(); } }, 100);
  });
}

function startDrag(e, id){
  const rec = openWindows.get(id);
  if(!rec || rec.maximized) return;
  if(e.target.closest('.tb-btns')) return;
  e.preventDefault();
  focusWin(id);
  const el = rec.el;
  const offX = e.clientX - el.offsetLeft;
  const offY = e.clientY - el.offsetTop;
  const w = el.offsetWidth;
  function move(ev){
    let x = ev.clientX - offX;
    let y = ev.clientY - offY;
    x = Math.max(-w + 100, Math.min(x, window.innerWidth - 100));
    y = Math.max(0, Math.min(y, window.innerHeight - 80));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  }
  function up(){
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}
function startResize(e, id, dir){
  const rec = openWindows.get(id);
  if(!rec || rec.maximized) return;
  e.preventDefault(); e.stopPropagation();
  focusWin(id);
  const el = rec.el;
  const sx = e.clientX, sy = e.clientY;
  const sl = el.offsetLeft, st = el.offsetTop;
  const sw = el.offsetWidth, sh = el.offsetHeight;
  const MINW = 280, MINH = 180;
  function move(ev){
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    let L = sl, T = st, W = sw, H = sh;
    if(dir.includes('e')) W = Math.max(MINW, sw + dx);
    if(dir.includes('s')) H = Math.max(MINH, sh + dy);
    if(dir.includes('w')){ W = Math.max(MINW, sw - dx); L = sl + (sw - W); }
    if(dir.includes('n')){ H = Math.max(MINH, sh - dy); T = st + (sh - H); }
    el.style.left = L + 'px';
    el.style.top = T + 'px';
    el.style.width = W + 'px';
    el.style.height = H + 'px';
  }
  function up(){
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}
window.addEventListener('resize', () => {
  openWindows.forEach(rec => {
    if(rec.maximized){
      rec.el.style.width = window.innerWidth + 'px';
      rec.el.style.height = (window.innerHeight - 46) + 'px';
    }
  });
});

function renderTasks(){
  const tc = document.getElementById('tasks');
  tc.innerHTML = '';
  openWindows.forEach((w, id) => {
    const reg = APP_BY_ID[w.appId];
    if(!reg) return;
    const b = document.createElement('button');
    b.className = 'task active' + (focusedId === id && !w.minimized ? ' focus' : '');
    b.innerHTML = `<span class="ti">${reg.icon}</span><span class="tt">${esc(w.title)}</span>`;
    b.addEventListener('click', () => {
      if(focusedId === id && !w.minimized) minimizeWin(id);
      else { restoreWin(id); focusWin(id); }
    });
    tc.appendChild(b);
  });
}

const bootOut = document.getElementById('bootout');
function bootLine(text='', cls=''){
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text === '' ? '\u00A0' : text;
  bootOut.appendChild(div);
  bootOut.scrollTop = bootOut.scrollHeight;
  return div;
}
function bootProgress(label, duration){
  return new Promise(resolve => {
    const div = document.createElement('div');
    bootOut.appendChild(div);
    const width = 24, steps = 14, stepTime = duration / steps;
    let i = 0;
    const tick = () => {
      const pct = Math.round((i / steps) * 100);
      const filled = Math.round((i / steps) * width);
      const bar = '\u2588'.repeat(filled) + '\u2591'.repeat(width - filled);
      div.textContent = `  ${label.padEnd(22)} [${bar}] ${String(pct).padStart(3)}%`;
      i++;
      if(i > steps){
        div.textContent = `  ${label.padEnd(22)} [${'\u2588'.repeat(width)}] 100%   [ OK ]`;
        div.className = 'ok';
        bootOut.scrollTop = bootOut.scrollHeight;
        resolve();
        return;
      }
      setTimeout(tick, stepTime);
    };
    tick();
  });
}

function promptForSources(){
  return new Promise(resolve => {
    const panel = document.createElement('div');
    panel.className = 'boot-panel';
    const canFSA = typeof window.showDirectoryPicker === 'function';

    panel.innerHTML = `
      <div class="t">NyxOS needs access to its application files</div>
      <div class="d">
        Your browser is running this page from <b>${location.protocol}//</b>, which prevents
        automatic reading of nearby files.<br><br>
        Select the <b>nyxos</b> folder — the one that contains <b>nyxos.html</b>,
        <b>nyx-prelude.nyx</b> and the <b>apps</b> subfolder.
      </div>
      <div class="row"></div>
    `;
    bootOut.appendChild(panel);
    const row = panel.querySelector('.row');

    if(canFSA){
      const b1 = document.createElement('button');
      b1.className = 'boot-btn';
      b1.textContent = '[ Select nyxos folder ]';
      b1.onclick = async () => {
        b1.disabled = true;
        b1.textContent = '[ opening picker... ]';
        try {
          const src = await SourceLoader.pickWithFSA();
          if(src && src['nyx-prelude.nyx']){
            panel.remove();
            resolve(src);
          } else {
            b1.disabled = false;
            b1.textContent = '[ Select nyxos folder ]';
            bootLine('  The folder you selected does not contain nyx-prelude.nyx', 'fail');
            bootLine('  Make sure you pick the folder that has nyxos.html in it.', 'dim');
          }
        } catch(e){
          b1.disabled = false;
          b1.textContent = '[ Select nyxos folder ]';
          if(e && e.name === 'AbortError') return;
          bootLine('  FSA error: ' + (e && e.message ? e.message : String(e)), 'fail');
        }
      };
      row.appendChild(b1);
    }

    const b2 = document.createElement('button');
    b2.className = 'boot-btn secondary';
    b2.textContent = canFSA ? '[ Use directory input ]' : '[ Select nyxos folder ]';
    b2.onclick = async () => {
      b2.disabled = true;
      const src = await SourceLoader.pickWithWebkitDirectory();
      b2.disabled = false;
      if(src && src['nyx-prelude.nyx']){
        panel.remove();
        resolve(src);
      } else if(src){
        bootLine('  The folder you selected does not contain nyx-prelude.nyx', 'fail');
        bootLine('  Pick the folder that has nyxos.html in it.', 'dim');
      }
    };
    row.appendChild(b2);

    const b3 = document.createElement('button');
    b3.className = 'boot-btn secondary';
    b3.textContent = '[ Cancel ]';
    b3.onclick = () => {
      panel.remove();
      bootLine('');
      bootLine('  cancelled - reload the page to try again.', 'dim');
      resolve(null);
    };
    row.appendChild(b3);

    bootOut.scrollTop = bootOut.scrollHeight;
  });
}

async function locateSources(report){
  if(location.protocol === 'http:' || location.protocol === 'https:'){
    report('trying fetch() ...');
    const http = await SourceLoader.tryHttp();
    if(http && http['nyx-prelude.nyx']){
      report('loaded via fetch()', true);
      return { sources: http, method: 'http' };
    }
    report('fetch() failed', false);
  } else {
    report('skipping fetch() (protocol is ' + location.protocol + ')');
  }

  report('checking for saved folder permission ...');
  const restored = await SourceLoader.tryRestoreHandle();
  if(restored && restored['nyx-prelude.nyx']){
    report('loaded via saved folder handle', true);
    return { sources: restored, method: 'fsa' };
  }
  report('no saved folder handle');

  report('checking cached sources ...');
  const cached = await SourceLoader.tryCache();
  if(cached && cached['nyx-prelude.nyx']){
    report('loaded from cache', true);
    return { sources: cached, method: 'cache' };
  }
  report('no cache');

  report('prompting user for folder selection ...');
  const chosen = await promptForSources();
  if(chosen && chosen['nyx-prelude.nyx']){
    return { sources: chosen, method: 'user' };
  }
  return null;
}

async function bootSequence(){
  bootOut.innerHTML = '';
  bootLine('nyx kernel 1.0-monochrome booting...', 'bright');
  bootLine('');
  await sleep(120);

  const early = [
    'Initialising basic system settings ...',
    'Setting hostname: nyx',
    'INIT: Entering runlevel: 4',
    'rc.M ==> Going multiuser...'
  ];
  for(const s of early){ bootLine(s, 'dim'); await sleep(55); }
  await sleep(60);

  const okSteps = [
    'Starting system logger','Initialising hardware','Setting up modules',
    'Initialising network','Setting up localhost'
  ];
  for(const s of okSteps){
    const pad = Math.max(2, 50 - s.length - 3);
    bootLine(`${s} ...${' '.repeat(pad)}[ OK ]`, 'ok');
    await sleep(55);
  }
  bootLine('');

  bootLine('Locating nyx application sources ...', 'bright');
  bootLine('');

  const report = (msg, ok) => {
    if(ok === true) bootLine('  [ OK ] ' + msg, 'ok');
    else if(ok === false) bootLine('  [ !! ] ' + msg, 'fail');
    else bootLine('  [ -- ] ' + msg, 'dim');
  };

  let located;
  try {
    located = await locateSources(report);
  } catch(e){
    bootLine('');
    bootLine('FATAL: source detection threw: ' + (e && e.message ? e.message : String(e)), 'fail');
    haltBoot('source detection error');
    return;
  }

  if(!located || !located.sources || !located.sources['nyx-prelude.nyx']){
    bootLine('');
    bootLine('FATAL: nyx-prelude.nyx was not located.', 'fail');
    bootLine('NyxOS cannot run without its Python runtime bridge.', 'dim');
    haltBoot('missing nyx-prelude.nyx');
    return;
  }

  SourceLoader.sources = located.sources;
  SourceLoader.method = located.method;
  PRELUDE_SOURCE = located.sources['nyx-prelude.nyx'];

  bootLine('');
  bootLine('Source summary:', 'bright');
  bootLine('  [ OK ] nyx-prelude.nyx', 'ok');
  for(const a of APP_REGISTRY){
    const key = 'apps/' + a.id + '.nyx';
    const ok = !!located.sources[key];
    APP_AVAILABLE[a.id] = ok;
    if(ok) bootLine('  [ OK ] ' + key, 'ok');
    else bootLine('  [ !! ] ' + key, 'fail');
  }

  const missing = APP_REGISTRY.filter(a => !APP_AVAILABLE[a.id]);
  bootLine('');
  if(missing.length){
    bootLine('WARNING: ' + missing.length + ' application(s) not found.', 'warn');
    bootLine('Those icons will be disabled.', 'dim');
  } else {
    bootLine('  all ' + APP_REGISTRY.length + ' applications loaded', 'ok');
  }
  bootLine('');

  if(located.method !== 'http'){
    try { await SourceLoader.saveToCache(); } catch(e){}
  }

  bootLine('Mounting nyxfs ...', 'bright');
  Storage.init();
  Storage.loadSettings();
  const restored = Storage.loadFS();
  if(restored){
    FS = restored;
    if(!FS.children.system) FS.children.system = mkdir();
    SYS_FILES.forEach(f => {
      if(!FS.children.system.children[f])
        FS.children.system.children[f] = mkfile('# ' + f + '\n');
    });
    bootLine('  [ OK ] Restored nyxfs', 'ok');
  } else {
    bootLine('  [ OK ] Fresh nyxfs initialized', 'ok');
  }
  bootLine('');

  bootLine('Loading nyx runtime (Pyodide) ...', 'bright');
  bootLine('');
  await bootProgress('python-runtime', 500);
  try {
    await initPyodide();
    bootLine('  [ OK ] Python runtime ready', 'ok');
  } catch(e){
    bootLine('  [ !! ] Python runtime failed: ' + (e && e.message ? e.message : String(e)), 'fail');
    haltBoot('python runtime');
    return;
  }
  bootLine('');
  await sleep(180);
  bootLine('nyx is ready.', 'bright');
  bootLine('');
  await sleep(280);

  document.getElementById('boot').classList.add('done');
  setTimeout(() => { document.getElementById('boot').style.display = 'none'; }, 500);

  if(readUsers().length === 0) showLock('setup');
  else showLock('login');
}

function haltBoot(reason){
  const h = document.createElement('div');
  h.className = 'fail';
  h.style.marginTop = '14px';
  h.textContent = '=== boot halted (' + reason + ') ===';
  bootOut.appendChild(h);
  const d = document.createElement('div');
  d.className = 'dim';
  d.textContent = 'Fix the missing files and reload the page.';
  bootOut.appendChild(d);
  bootOut.scrollTop = bootOut.scrollHeight;
}

/* ==================================================================
   Lock screen
   ================================================================== */
const lockState = {
  mode: 'login',
  phase: 'user',
  pendingUser: null,
  pendingPass: null
};

function addLockLine(text, cls){
  const out = document.getElementById('lock-out');
  const d = document.createElement('div');
  d.className = 'lock-line' + (cls ? ' ' + cls : '');
  d.textContent = text === '' ? '\u00A0' : text;
  out.appendChild(d);
  const lock = document.getElementById('lock');
  lock.scrollTop = lock.scrollHeight;
}

function updateLockPrompt(){
  let p = 'user: ';
  if(lockState.mode === 'setup'){
    if(lockState.phase === 'user') p = 'username: ';
    else if(lockState.phase === 'pass') p = 'password: ';
    else if(lockState.phase === 'confirm') p = 'confirm:  ';
  } else {
    if(lockState.phase === 'user') p = 'user: ';
    else if(lockState.phase === 'pass') p = 'password: ';
  }
  document.getElementById('lock-prompt').textContent = p;
}

function showLock(mode){
  lockState.mode = mode;
  lockState.phase = 'user';
  lockState.pendingUser = null;
  lockState.pendingPass = null;

  document.getElementById('lock').classList.add('show');
  const out = document.getElementById('lock-out');
  out.innerHTML = '';

  if(mode === 'setup'){
    addLockLine('nyx first boot setup', 'lock-hdr');
    addLockLine('');
    addLockLine('no users found on this system.');
    addLockLine('create the first account to continue.');
    addLockLine('');
    addLockLine('tip: to wipe all data at any time, type: resetbootall', 'lock-dim');
    addLockLine('');
  } else {
    addLockLine('nyx login', 'lock-hdr');
    addLockLine('');
    addLockLine('tip: forgot your credentials? type: resetbootall', 'lock-dim');
    addLockLine('');
  }

  updateLockPrompt();
  const inp = document.getElementById('lock-input');
  inp.value = '';
  inp.disabled = false;
  document.getElementById('lock-typed').textContent = '';
  setTimeout(() => inp.focus(), 50);
}

function handleLockSubmit(value){
  const raw = String(value || '');
  const trimmed = raw.trim();

  if(trimmed.toLowerCase() === 'resetbootall'){
    const promptText = document.getElementById('lock-prompt').textContent;
    addLockLine(promptText + trimmed);
    addLockLine('');
    addLockLine('!!! FACTORY RESET !!!', 'lock-err');
    addLockLine('wiping all users, files, and settings ...', 'lock-err');
    addLockLine('');
    addLockLine('reloading ...', 'lock-err');
    document.getElementById('lock-input').value = '';
    document.getElementById('lock-typed').textContent = '';
    document.getElementById('lock-input').disabled = true;
    setTimeout(() => __nyxjs.resetBootAll(), 300);
    return;
  }

  const promptText = document.getElementById('lock-prompt').textContent;
  const masked = (lockState.phase === 'pass' || lockState.phase === 'confirm');
  addLockLine(promptText + (masked ? '*'.repeat(raw.length) : raw));
  document.getElementById('lock-input').value = '';
  document.getElementById('lock-typed').textContent = '';

  if(lockState.mode === 'setup') handleSetupInput(raw);
  else handleLoginInput(raw);
}

function handleLoginInput(value){
  if(lockState.phase === 'user'){
    const u = value.trim();
    if(!u){ addLockLine('username required', 'lock-err'); addLockLine(''); return; }
    if(!userExists(u)){ addLockLine('login incorrect', 'lock-err'); addLockLine(''); return; }
    lockState.pendingUser = u;
    lockState.phase = 'pass';
    updateLockPrompt();
  } else if(lockState.phase === 'pass'){
    const sh = readShadow();
    const u = lockState.pendingUser;
    if(!u || !(u in sh) || sh[u] !== value){
      addLockLine('login incorrect', 'lock-err');
      addLockLine('');
      lockState.phase = 'user';
      lockState.pendingUser = null;
      updateLockPrompt();
      return;
    }
    const user = readUsers().find(x => x.username === u);
    finishLogin(user);
  }
}

function handleSetupInput(value){
  if(lockState.phase === 'user'){
    const u = value.trim();
    if(!u){ addLockLine('username required', 'lock-err'); addLockLine(''); return; }
    if(!/^[A-Za-z_][A-Za-z0-9_-]*$/.test(u)){
      addLockLine('invalid username (letters, digits, _ and -)', 'lock-err');
      addLockLine('');
      return;
    }
    if(userExists(u)){ addLockLine('user already exists', 'lock-err'); addLockLine(''); return; }
    lockState.pendingUser = u;
    lockState.phase = 'pass';
    updateLockPrompt();
  } else if(lockState.phase === 'pass'){
    if(!value){ addLockLine('password required', 'lock-err'); addLockLine(''); return; }
    lockState.pendingPass = value;
    lockState.phase = 'confirm';
    updateLockPrompt();
  } else if(lockState.phase === 'confirm'){
    if(value !== lockState.pendingPass){
      addLockLine('passwords do not match', 'lock-err');
      addLockLine('');
      lockState.phase = 'pass';
      lockState.pendingPass = null;
      updateLockPrompt();
      return;
    }
    if(!createUser(lockState.pendingUser, lockState.pendingPass)){
      addLockLine('could not create account', 'lock-err');
      lockState.phase = 'user';
      lockState.pendingUser = null;
      lockState.pendingPass = null;
      updateLockPrompt();
      return;
    }
    Storage.saveFS();
    addLockLine('');
    addLockLine('account created — welcome.');
    const user = readUsers().find(x => x.username === lockState.pendingUser);
    finishLogin(user);
  }
}

document.getElementById('lock-input').addEventListener('input', e => {
  const v = e.target.value;
  const masked = (lockState.phase === 'pass' || lockState.phase === 'confirm');
  document.getElementById('lock-typed').textContent = masked ? '*'.repeat(v.length) : v;
});

document.getElementById('lock-input').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    const v = document.getElementById('lock-input').value;
    handleLockSubmit(v);
  } else if(e.key === 'Tab'){
    e.preventDefault();
  }
});

document.getElementById('lock').addEventListener('click', () => {
  const inp = document.getElementById('lock-input');
  if(!inp.disabled) inp.focus();
});

function finishLogin(user){
  currentUser = user.username;
  currentUserObj = user;
  const lock = document.getElementById('lock');
  lock.style.transition = 'opacity .4s';
  lock.style.opacity = '0';
  setTimeout(() => {
    lock.classList.remove('show');
    lock.style.opacity = '';
    lock.style.transition = '';
    const inp = document.getElementById('lock-input');
    inp.disabled = false;
    document.getElementById('desktop').classList.add('show');
    initDesktop();
    if(!sessionStorage.getItem('nyx_welcomed')){
      sessionStorage.setItem('nyx_welcomed', '1');
      if(APP_AVAILABLE.terminal) openApp('terminal');
    }
  }, 400);
}

let desktopInited = false;
function initDesktop(){
  if(desktopInited) return;
  desktopInited = true;
  applySettings();
  buildDesktopIcons();
  buildStartMenu();
  renderTasks();
  updateClock();
  setInterval(updateClock, 1000);
}

/* ==================================================================
   Go
   ================================================================== */
bootSequence();
</script>
